<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-label="Hand-tracking robotic hand: webcam or flex sensor glove, MediaPipe, Arduino Uno, five servos.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#132a3f"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#5eead4"/>
    </marker>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
    <!-- inputs -->
    <rect x="40" y="90" width="190" height="90" rx="12" fill="#0f1b2d" stroke="#38bdf8" stroke-width="2"/>
    <text x="135" y="130" font-size="22" font-weight="700" fill="#f1f5f9">Webcam</text>
    <text x="135" y="158" font-size="16" fill="#94a3b8">MediaPipe Hands</text>

    <rect x="40" y="270" width="190" height="90" rx="12" fill="#0f1b2d" stroke="#38bdf8" stroke-width="2"/>
    <text x="135" y="310" font-size="22" font-weight="700" fill="#f1f5f9">Flex glove</text>
    <text x="135" y="338" font-size="16" fill="#94a3b8">5 flex sensors</text>

    <!-- controller -->
    <rect x="320" y="165" width="190" height="120" rx="12" fill="#0f1b2d" stroke="#2dd4bf" stroke-width="3"/>
    <text x="415" y="215" font-size="24" font-weight="700" fill="#f1f5f9">Arduino Uno</text>
    <text x="415" y="245" font-size="16" fill="#94a3b8">bend % per finger</text>

    <!-- servos -->
    <rect x="600" y="125" width="160" height="200" rx="12" fill="#0f1b2d" stroke="#38bdf8" stroke-width="2"/>
    <text x="680" y="165" font-size="22" font-weight="700" fill="#f1f5f9">5 servos</text>
    <g fill="#2dd4bf">
      <rect x="626" y="190" width="108" height="14" rx="7" fill-opacity="0.9"/>
      <rect x="626" y="214" width="108" height="14" rx="7" fill-opacity="0.75"/>
      <rect x="626" y="238" width="108" height="14" rx="7" fill-opacity="0.6"/>
      <rect x="626" y="262" width="108" height="14" rx="7" fill-opacity="0.45"/>
      <rect x="626" y="286" width="108" height="14" rx="7" fill-opacity="0.3"/>
    </g>

    <!-- links -->
    <g stroke="#5eead4" stroke-width="3" fill="none" marker-end="url(#arrow)">
      <path d="M230 135 C 275 135, 275 200, 316 205"/>
      <path d="M230 315 C 275 315, 275 250, 316 245"/>
      <path d="M510 225 H 596"/>
    </g>
    <text x="268" y="122" font-size="14" fill="#5eead4">USB serial</text>
    <text x="268" y="345" font-size="14" fill="#5eead4">analog</text>
    <text x="553" y="212" font-size="14" fill="#5eead4">PWM</text>

    <text x="400" y="410" font-size="18" fill="#cbd5e1">Each servo pulls one finger tendon</text>
  </g>
</svg>
